oad 可选字段，技术路径 1.5 模板与透视规格，方案/计划同步\" && git log --oneline -4 && git status --short", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"import re; s=open('nav_sim_v2.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && echo \"SYNTAX OK\" && rm _t.js && python -c \"\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nprint('PROJ锚点:', re.search(r'const PROJ = \\{([^}]*)\\}',s).group(1))\nprint('flow edge调用(edgeLines内drawFlowingDashLine):', s.count('drawFlowingDashLine(L1[0]'))\nprint('模板分支推进animOffset:', 'animOffset = (animOffset + CONFIG.roadEdgeSpeed*dt)' in s)\nprint('roadStraight参数化:', 'function roadStraight(c, halfW)' in s)\nprint('TPL常量:', 'const TPL' in s)\nprint('北出口零段残留(应False):', '[160,22],[160,22]' in s)\nprint('straight含navPath:', s.count(\\\"straight(){ const c=[[160,134],[160,22]]; roadStraight(c, TPL.main); navPath(c); }\\\")==1)\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"\nimport re\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nprint('PROJ锚点:', re.search(r'const PROJ = \\{([^}]*)\\}',s).group(1))\nprint('flow edge:', s.count('drawFlowingDashLine(L1[0]')==1 and s.count('drawFlowingDashLine(R1[0]')==1)\nprint('推进animOffset:', 'animOffset = (animOffset + CONFIG.roadEdgeSpeed*dt)' in s)\nprint('roadStraight参数化:', 'function roadStraight(c, halfW)' in s)\nprint('TPL:', 'const TPL' in s, '| 北出口零段残留:', '[160,22],[160,22]' in s)\nprint('straight含navPath:', s.count('roadStraight(c, TPL.main); navPath(c)')==1)\nprint('rbt南引路32:', 'branch([[160,134],[160,118]],32)' in s)\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"import re; s=open('nav_sim_v2.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && echo \"SYNTAX OK\" && rm _t.js && python -c \"\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nfor k in ['TP_CAR = [160,113]','wrapPopupLines','paintPopupText()','dimScreen','openPopup','closePopup','clearPopupTimers','POPUP_LINE_MS','popupMsg.top']:\n    print(k,'->',s.count(k))\nprint('paintPopupText内tctx(应0):', s[s.find('function paintPopupText'):s.find('function paintLostText')].count('tctx'))\nprint('renderFrame弹窗末置:', s.count('dimScreen();') )\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"import re; s=open('nav_sim_v2.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && echo \"SYNTAX OK\" && rm _t.js && python -c \"\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nprint('TPL:', re.search(r'const TPL = \\{([^}]*)\\}',s).group(1))\nprint('branchStatic调用:', s.count('branchStatic('))\nprint('staticEdges定义:', 'function staticEdges' in s)\nprint('首屏+3s:', 'POPUP_LINE_MS + 3000' in s)\nprint('环岛新尺寸(cy74/rOut52):', 'cy=74, rOut=52' in s, '| 南引路40:', 'branch([[160,134],[160,126]],40)' in s)\nprint('multi ellipse21:', '21*scaleAt(cy)' in s)\nprint('TP_CAR:', 'TP_CAR = [160,113]' in s)\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"import re; s=open('nav_sim_v2.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && echo \"SYNTAX OK\" && rm _t.js && python -c \"\nimport re\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nprint('TPL:', re.findall(r'const TPL = \\{([^}]*)\\}',s))\nprint('branchStatic调用数:', s.count('branchStatic('))\nprint('staticEdges定义:', 'function staticEdges' in s)\nprint('首屏+3s:', 'POPUP_LINE_MS + 3000' in s)\nprint('rbt cy74 rOut52:', 'cy=74, rOut=52' in s)\nprint('multi ellipse21:', '21*scaleAt(cy)' in s)\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1 && python docs/develp/_tmp_patch6.py && rm docs/develp/_tmp_patch6.py && echo \"script removed\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1 && python - <<'PYEOF'\n# -*- coding: utf-8 -*-\nimport io\n\ndef load(p):\n    return open(p, encoding='utf-8').read()\n\ndef save(p, s):\n    open(p, 'w', encoding='utf-8', newline='').write(s)\n\ndef rep1(s, old, new, tag):\n    if s.count(old) != 1:\n        raise SystemExit('ANCHOR FAIL(%d): %s' % (s.count(old), tag))\n    return s.replace(old, new)\n\np1 = 'docs/develp/技术实现路径.md'\ns = load(p1)\ns = rep1(s, '（V1.5）', '（V1.6）', 'T1 版本引用')\ns = rep1(s,\n    '6. **约束更新**：放弃真实路口矢量还原不变；路口段由\"统一条带\"改为\"模板化近似几何放大图\"，直行段仍为宽条带。',\n    '6. **约束更新**：放弃真实路口矢量还原不变；路口段由\"统一条带\"改为\"模板化近似几何放大图\"，直行段仍为宽条带。\\n'\n    '7. **视觉验收冻结基准（2026-09-02，nav_sim_v2.html V2 迭代）**：模板近端路面基准半宽 main≈62px（主通行近宽≈124px，较初版 +1/3）；道路两侧流动虚线仅绘制在**导航路径所在道路**，其余支路为静态边线；环岛 rOut≈52；黄车三角较路径起点上移约一个身位；弹窗显示规则见 2.1。',\n    'T2 1.5 第7条')\ns = rep1(s,\n    '- 缓冲策略：LCD 控制器自带 GRAM',\n    '- 弹窗显示规则（V1.6）：内容可视 3 行×17 全角；超长内容首屏多停 3s（约 4.4s）后每 1.4s 逐行上滚、末屏停留 2.4s 自动关闭；弹窗期间非弹窗区域置灰、弹窗文字绿色，关闭恢复。\\n'\n    '- 缓冲策略：LCD 控制器自带 GRAM',\n    'T3 2.1 弹窗规则')\nsave(p1, s)\nprint('OK 技术实现路径.md')\n\np2 = 'docs/develp/实施计划.md'\ns = load(p2)\ns = rep1(s, '（已完成 V1.5）', '（已完成 V1.6）', 'P1 版本引用')\nsave(p2, s)\nprint('OK 实施计划.md')\nPYEOF\nrm docs/develp/_tmp_patch6.py 2>/dev/null; echo \"tmp cleaned\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1 && git add -A && git commit -m \"feat(html+v1.6): v2 视觉验收迭代 — 弹窗首屏+3s/滚动/置灰绿字、模板近宽+1/3、流动虚线仅导航道路；协议 V1.6 行为澄清 + 文档同步\" && git log --oneline -3 && git status --short && cd docs/develp && for f in nav_sim_v2.html nav_sim_v3.html; do python -c \"import re,sys; s=open('$f',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && rm _t.js && echo \"$f OK\"; done", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"import re; s=open('nav_sim_v2.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && echo \"SYNTAX OK\" && rm _t.js && python -c \"\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nprint('roundedRing新签名:', 'function roundedRing(cx,cy,a,b,t)' in s)\nprint('ellArcPts定义/调用:', 'function ellArcPts' in s, s.count('ellArcPts('))\nprint('旧rOut残留(应False):', 'rOut' in s[s.find('function rbtCase'):s.find('function setRoad')])\nprint('横椭圆a>b:', 'a=58, b=34' in s)\nprint('角语义注释:', '南=90°' in s)\nprint('弧线走ellArcPts:', 'ellArcPts(cx,cy,aM,bM' in s)\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1 && python - <<'PYEOF'\n# -*- coding: utf-8 -*-\np='docs/develp/技术实现路径.md'\ns=open(p,encoding='utf-8').read()\nold='环岛 rOut≈52'\nnew='环岛透视呈横椭圆（长轴水平 a≈58 / 垂直半轴 b≈34）'\nassert s.count(old)==1\ns=s.replace(old,new)\nopen(p,'w',encoding='utf-8',newline='').write(s)\nprint('OK 技术实现路径.md')\nPYEOF", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1 && git add -A && git commit -m \"fix(html): 环岛透视修正 — 环形改为横椭圆(长轴水平 a58/b34)，行驶弧沿椭圆环带中线(ellArcPts)；同步技术路径 1.5\" && git log --oneline -2 && git status --short", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"import re; s=open('nav_sim_v2.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && echo \"SYNTAX OK\" && rm _t.js && python -c \"\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nprint('纵轴b=23(缩小1/3):', 'a=58, b=23' in s and 'aIn=38, bIn=10' in s)\nprint('roundedRing四轴:', 'function roundedRing(cx,cy,a,b,aIn,bIn)' in s)\nprint('badges状态:', 'let badges = {wx:2, sms:1, call:3}' in s)\nprint('paintBadges定义/调用:', s.count('function paintBadges')==1, s.count('paintBadges()')>=2)\nprint('badgeCount/drawIconTile/simBadge:', all(x in s for x in ['badgeCount','drawIconTile','simBadge']))\nprint('角标函数在文字层调用:', 'paintBadges();' in s)\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"import re; s=open('nav_sim_v2.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && echo \"SYNTAX OK\" && rm _t.js && python -c \"\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nprint('锚顶等比放大已插入:', 'ctx.translate(160, 22); ctx.scale(_k, _k)' in s)\nprint('_k 公式:', 'CONFIG.areaMain.h - 4 - 22' in s)\nk=(160-4-22)/(132-22)\nprint('当前 h=160 → k=%.4f (近端y132→%.1f, 底宽x1.218)'%(k, 22+(132-22)*k))\nprint('badges 贴底 by:', 'CONFIG.areaMain.h - 22' in s, '→ y=', 160-22)\nprint('restore配对: 主视图区 restore 计数仍为1(应在transform后):', s[s.find('ctx.translate(160, 22)'):s.find('function drawPopupBg')].count('ctx.restore()')==1)\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"import re; s=open('nav_sim_v2.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && echo \"SYNTAX OK\" && rm _t.js && python -c \"\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nprint('k=1.1 生长11px:', '(132 + 11 - 22)' in s)\nprint('badge y123:', 'const by = 123;' in s)\nk=1.1\nprint('近端y: %.0f, 底边(160)间隙: %.0fpx, 底宽x1.1'%(22+(132-22)*k, 160-(22+(132-22)*k)))\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1 && python - <<'PYEOF'\n# -*- coding: utf-8 -*-\np='docs/develp/技术实现路径.md'\ns=open(p,encoding='utf-8').read()\n\nsec = (\n    '### 1.6 转向过程与防误判策略\\n'\n    '> 目标：路口转向/变道时画面变化可信、不易误判（渲染验收口径；HTML \"通过路口\"演示待补）。\\n'\n    '\\n'\n    '**阶段帧序列（手机端驱动）**\\n'\n    '1. 直行接近（>200m）：帧无 `road` 字段 → 行驶条带；仅顶部机动文字/符号预告。\\n'\n    '2. 放大图进入（`turn_dist` < 200m 且非直行）：附加 `road`；模板南引路与行驶条带同轴同宽（当前路延续）；非导航支路静态、当前路两侧流动高亮（V1.6 已冻结）。\\n'\n    '3. 转向执行：车标沿绿路径（模板内真实走向：十字直角 / 环岛椭圆弧）由入口推进至出口。\\n'\n    '4. 驶离恢复：去掉 `road`；新行驶条带按转向后 heading 生成，其中轴 = 模板出口方向、车在底部同位。\\n'\n    '\\n'\n    '**防误判规则（推荐默认，两端一致）**\\n'\n    '1. 切换时序：远距仅文字预告；中距（≤200m）模板 150-250ms 淡入（防闪变）；驶出后 ≥100m 稳定窗口，不触发下一模板（防连续路口跳变）。\\n'\n    '2. 几何连续：入/出口衔接禁止中心线角度突变；切回条带中轴 = 出口方向；车位置连续。\\n'\n    '3. 单一语义：顶部机动文字/符号、绿路径拐向、模板出口三者恒同向，不一致时退回条带；绿路径始终最亮、最上层。\\n'\n    '4. heading 处理：手机端限速旋转 + 低通；模板几何不随 heading 转动，仅车标/罗盘联动（省带宽、防运动眩晕）。\\n'\n    '5. 滞回与异常：进入 200m / 退出 60m 滞回防抖；导航重算/偏航立即丢弃模板回条带、按新路线重走流程；弹窗/信号中断不遮挡绿路径与出口区。\\n'\n    '6. 极端机动：掉头/U-turn 用专用 U 形弧路径 + 转向符号（不套十字模板）；斜交/连续岔路优先分叉引导（fork/multi）。\\n'\n    '\\n'\n)\nanchor = '## 2. ESP32\\u2011S3固件实现'\nassert s.count(anchor) == 1\ns = s.replace(anchor, sec + anchor, 1)\nopen(p,'w',encoding='utf-8',newline='').write(s)\nprint('OK 技术实现路径.md §1.6')\nPYEOF", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"import re; s=open('nav_sim_v2.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && echo \"SYNTAX OK\" && rm _t.js && python -c \"\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nfor k in ['function turnDemo','function finishTurn','function pointOnPath','function clearDemoTimers','let demoFade = -1','let demoCar = null','let demoHandle = null','turnDemo()','demoCar = {pts:pathPts']:\n    print(k,'->',s.count(k))\nprint('drawScene引用demoFade/demoCar:', 'demoFade>=0' in s and 'pointOnPath(demoCar.pts' in s)\nprint('清理钩子: loadSample/setRoad/clearScreen含clearDemoTimers:',\n      s[s.find('function loadSample'):s.find('function loadSample')+90].count('clearDemoTimers')>0,\n      s[s.find('function setRoad'):s.find('function setRoad')+60].count('clearDemoTimers')>0,\n      s[s.find('function clearScreen'):s.find('function clearScreen')+60].count('clearDemoTimers')>0)\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python - <<'PYEOF'\n# -*- coding: utf-8 -*-\nimport io\ndef load(p): return open(p, encoding='utf-8', newline='').read()\ndef show(p, keys):\n    s = load(p)\n    print('==', p, '| CRLF:', '\\r\\n' in s, '| 弯引号(U+201C/D):', ('\\u201c' in s or '\\u201d' in s))\n    for k in keys:\n        print('   count=%d  %s' % (s.count(k), k[:38]))\nshow('ble_protocol.md', [\n  '> 版本：V1.6',\n  '发送端预截断到 ≤48 全角并追加省略号',\n  'turn_right | roundabout_N | fork_left | fork_right',\n  '如 `L | R | E | N | W | NE`',\n  '> 触发（主机侧）',\n  '内容区可视 3 行 × 17 全角',\n  '6. 导航帧超时',\n  '接收端依靠换行重组。',\n  '| V1.6 | 2026-09-02 | 行为澄清',\n])\nshow('技术实现路径.md', [\n  '（V1.6）为准，本节为要点摘录',\n  '近端 y=134 全宽',\n  '模板南引路与行驶条带同轴同宽',\n  '弹窗显示规则（V1.6）',\n  '连续 3s 无 NAV_FRAME）提示层',\n  'ESP32 侧按 `\\\\n` 重组，不受包长影响。',\n  '组装 POPUP_MSG JSON 报文 → BLE 发送。',\n])\nPYEOF", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -X utf8 - <<'PYEOF'\n# -*- coding: utf-8 -*-\ndef load(p): return open(p, encoding='utf-8', newline='').read()\ndef show(p, keys):\n    s = load(p)\n    print('==', p, '| CRLF:', '\\r\\n' in s, '| 弯引号:', ('\\u201c' in s or '\\u201d' in s))\n    for k in keys:\n        print('   count=%d  %s' % (s.count(k), k[:40]))\nshow('ble_protocol.md', [\n  '> 版本：V1.6',\n  '发送端预截断到 ≤48 全角并追加省略号',\n  'turn_right | roundabout_N | fork_left | fork_right',\n  '如 `L | R | E | N | W | NE`',\n  '> 触发（主机侧）',\n  '内容区可视 3 行 × 17 全角',\n  '6. 导航帧超时',\n  '接收端依靠换行重组。',\n  '| V1.6 | 2026-09-02 | 行为澄清',\n])\nshow('技术实现路径.md', [\n  '（V1.6）为准，本节为要点摘录',\n  '近端 y=134 全宽',\n  '模板南引路与行驶条带同轴同宽',\n  '弹窗显示规则（V1.6）',\n  '连续 3s 无 NAV_FRAME）提示层',\n  'ESP32 侧按 `\\\\n` 重组，不受包长影响。',\n  '组装 POPUP_MSG JSON 报文 → BLE 发送。',\n])\nPYEOF", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -X utf8 - <<'PYEOF'\ndef load(p): return open(p, encoding='utf-8', newline='').read()\nb = load('ble_protocol.md').split('\\n')\nprint('--- ble_protocol 前6行 ---')\nfor i, l in enumerate(b[:6], 1): print(i, repr(l))\nprint('--- 含 预截断 行 ---')\nfor i, l in enumerate(b, 1):\n    if '预截断' in l: print(i, repr(l))\nt = load('技术实现路径.md').split('\\n')\nprint('--- 技术路径 含 MTU/重组 行 ---')\nfor i, l in enumerate(t, 1):\n    if 'MTU' in l or '重组' in l: print(i, repr(l))\nPYEOF", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -X utf8 - <<'PYEOF'\n# -*- coding: utf-8 -*-\ndef load(p): return open(p, encoding='utf-8', newline='').read()\ndef save(p, s): open(p, 'w', encoding='utf-8', newline='').write(s)\n\ndef patch(p, ops):\n    \"\"\"ops: list of (prefix, [newline1, newline2...]) — 命中唯一含前缀的行后整行替换为给定行序列\"\"\"\n    lines = load(p).split('\\n')\n    out = []\n    hits = {}\n    for ln in lines:\n        done = False\n        for prefix, repl in ops:\n            if prefix in ln:\n                hits[prefix] = hits.get(prefix, 0) + 1\n                out.extend(repl)\n                done = True\n                break\n        if not done:\n            out.append(ln)\n    bad = {k: v for k, v in hits.items() if v != 1}\n    if bad:\n        raise SystemExit('ANCHOR FAIL %s: %s' % (p, bad))\n    save(p, '\\n'.join(out))\n    print('OK', p, '| 替换点:', sorted(hits))\n\n# ================= ble_protocol.md =================\npatch('ble_protocol.md', [\n  ('> - 版本：V1.6', ['> - 版本：V1.7']),\n  ('> 4. 文本长度上限（按字符数）', [\n    '> 4. 文本长度上限（按字符数）：`hint` ≤ 48（顶栏单行；渲染端按 **≤9 全角**截断并追加省略号，建议发送端 ≤9 全角，见 §6.7）；`title` ≤ 32（弹窗标题 1 行，超出由渲染端按弹窗内可用宽度截断）；`content` ≤ 128（弹窗内容区按 16px 点阵显示 **3 行 × 16 全角**；超过 3 行由设备逐行滚动，**发送端不预截断**，见 §3.5）；']),\n  ('- `maneuver`（字符串，可选）', [\n    '- `maneuver`（字符串，可选）：当前机动类型，取值 `straight | curve | turn_left | turn_right | roundabout_N | fork_left | fork_right | multi | uturn`（N=环岛出口序数，语义见组合表与几何规格）。用于顶部提示与基础符号；`uturn` 为掉头专用，建议不带 `road`（条带 + `routeCenter` 内 U 形弧线表达）。']),\n  ('  - `dir`：方向参数', [\n    '  - `dir`：方向参数，**统一为车头相对语义**：`straight | left | right | exitN`（N=环岛目标出口序数，1 起，自南入口沿绕行方向计；`roundabout` 专用）。**不使用地理方位作 dir 值**；出口支路方位由可选 `exits` 提供。',\n    '  - `exits`（可选，仅 `roundabout`）：出口方向数组，元素取 `S | E | N | W | NE | NW | SE | SW`（车头朝上屏幕系，E=右 / N=上，车辆自 S=底部南入口进入）；渲染端据此绘制各出口支路几何。']),\n  ('> 触发（主机侧）', [\n    '> 触发（主机侧）：`turn_dist` 小于阈值（建议 200m）且机动非直行时附加 `road`；驶离路口后恢复不带 `road` 的帧。',\n    '> 叠加规则：模板 `type/dir/pts` 由手机按导航路线在该段内的**真实走向**生成；渲染顺序固定为 灰路网 → 亮绿路径（真实走向，画在路网之上）→ 车辆光标，路径以帧内路线数据为准、模板路网仅作背景示意。',\n    '> type×dir 合法组合（V1.7）：`straight`→dir 缺省；`curve`→`left|right`；`tjunc`→`left|right`；`cross`→`straight|left|right`；`roundabout`→`exitN`（配合 `exits`）；`fork`→`left|right`；`multi`→dir 缺省（支路与出口走线由 `pts` 表达）。',\n    '> 模板几何由渲染端按 `type/dir/exits` **参数化生成**（非预置造型）；参数化规则与 `pts` 语义见 `docs/develp/模板几何规格.md`（V1.7 草案，HTML V2 为验收基准）。']),\n  ('> 显示与滚动规则', [\n    '> 显示与滚动规则（V1.7）：内容区可视 **3 行 × 16 全角**（16px 点阵；折行按 16 全角/行宽度，与 HTML V2 一致）；≤3 行时静态显示（默认 5s）后自动关闭；**超过 3 行**（发送端**不预截断**，仅限 ≤128 上限）触发滚动：首屏停留约 4.4s（多停 3s）后每 1.4s 逐行上滚，末屏停留 2.4s 自动关闭（`popup_timeout`=0 时不自动关闭、不滚动）。弹窗期间：非弹窗区域整体**置灰**、弹窗标题与消息以**绿色**渲染，关闭弹窗后恢复正常显示。']),\n  ('6. 导航帧超时', [\n    '6. 导航帧超时（**仅限导航态**判定）：设备处于导航渲染态且连续 3s 未收到 NAV_FRAME（BLE 连接与心跳正常）→ 屏幕顶部显示\"信号中断\"并停止流动虚线动画；收到新 NAV_FRAME 后自动恢复刷新；待机 / 纯弹窗态不触发。计时边界：主机 PING 2s 保活；导航态 3s 无 NAV_FRAME 先触发\"信号中断\"；连续 5s 未收到**任何**主机报文或连接断开 → 判定链路异常并清屏（见 §3.7）。',\n    '7. 显示容量规则（渲染端强制，HTML V2 与 ESP32 一致）：`hint` 顶栏单行按 ≤9 全角截断并追加省略号；弹窗标题 1 行、超出弹窗内可用宽度截断；弹窗内容按 16 全角/行折行、可视 3 行，超过 3 行按 §3.5 滚动。']),\n  ('> - 如果字符串长度 > 240 字节', [\n    '> - 如果字符串长度 > 240 字节，自动分片多次 Write（Write Without Response 在 MTU 247 下有效载荷上限为 244 字节，保守按 240 切分）；接收端依靠换行重组。',\n    '>',\n    '> 主机（手机 APP）NAV_FRAME 发送策略（V1.7）：发送队列深度固定 1（**丢旧保新**，仅保留最新帧）；相邻 NAV_FRAME 最小间隔 ≥100ms（对应 ≤10fps）；POPUP_MSG / POPUP_CLOSE / SET_CONFIG 等事件帧插入发送、不被 NAV_FRAME 覆盖（导航帧可被更新帧覆盖丢弃）。']),\n  ('| V1.6 | 2026-09-02 | 行为澄清', [\n    '| V1.7 | 2026-09-03 | 审查决策落地：① `dir` 统一车头相对语义（straight/left/right/exitN），弃地理方位混列，`roundabout` 增可选 `exits`；`maneuver` 补 curve/multi/uturn；新增 type×dir 合法组合表（§3.1.1）。② 弹窗行容量更正为 3 行×16 全角；`content` 发送端不预截断（≤128），超 3 行触发滚动（§3.1/§3.5）。③ 新增 §6.7 渲染端显示容量规则。④ \"信号中断\"仅导航态判定，2s/3s/5s 计时边界写清。⑤ 主机 NAV_FRAME 丢旧保新发送策略（§5）。 |',\n    '| V1.6 | 2026-09-02 | 行为澄清']),\n])\n\n# ================= 技术实现路径.md =================\npatch('技术实现路径.md', [\n  ('（V1.6）为准，本节为要点摘录', [\n    '> 协议以 `docs/develp/ble_protocol.md`（V1.7）为准，本节为要点摘录。']),\n  ('2. **坐标与投影**', [\n    '2. **坐标与投影**：手机下发**车头朝上平面像素坐标**；渲染端统一施加主视图\"近大远小\"投影。**投影常量（V2 冻结、两端一致）**：`PROJ={cx:160, yNear:130, yFar:20, sNear:1.0, sFar:0.24}`，深度 y 线性缩放（`scaleAt`，远端收窄至 24%）、路面半宽随深度同步缩放、地面圆投影为横椭圆（环岛 a≈58/b≈23、内岛 aIn=38/bIn=10）；绘制前另施\"底部生长\"缩放（锚 y=22、k=(132+11−22)/(132−22)=1.1，近端下移约 11px 贴底、与底边保留约 17px 间隙）；与行驶条带同一视觉语言，常量以 nav_sim_v2.html `PROJ`/`drawScene` 为准。']),\n  ('2. 放大图进入（`turn_dist` < 200m 且非直行）', [\n    '2. 放大图进入（`turn_dist` < 200m 且非直行）：附加 `road`；模板南引路与行驶条带**同轴**（宽度按各自体系：条带近宽 150px / 模板引路半宽 TPL.main=62px 再经 k 缩放，非同一数值），衔接连续由手机端 centerLine 近端坐标与模板引路对齐保证；非导航支路静态、当前路两侧流动高亮（V1.6 已冻结）。']),\n  ('- 渲染状态机：`待机`', [\n    '- 渲染状态机：`待机`（黑屏）→ 收到 NAV_FRAME 进入 `导航`；`导航` 态可叠加 `弹窗`（POPUP_MSG，默认 5s 超时自动关）与 `信号中断`（**导航态下**连续 3s 无 NAV_FRAME；待机/纯弹窗态不触发）提示层；收到 CLEAR_SCREEN 或 BLE 断开回到 `待机`。']),\n  ('- 弹窗显示规则（V1.6）', [\n    '- 弹窗显示规则（V1.7）：内容可视 **3 行 × 16 全角**（折行按 16 全角/行，与 HTML 一致）；发送端**不预截断**（≤128）；超过 3 行触发滚动：首屏多停 3s（约 4.4s）后每 1.4s 逐行上滚、末屏停留 2.4s 自动关闭；弹窗期间非弹窗区域置灰、弹窗文字绿色，关闭恢复。']),\n  ('    - MTU 自适应分包', [\n    '    - MTU 自适应分包：以协商后实际 MTU-3 为单包上限切分（不固定 240），ESP32 侧按 `\\\\n` 重组，不受包长影响。',\n    '    - NAV_FRAME 发送策略（V1.7）：发送队列深度 1（丢旧保新，仅保留最新帧）；相邻帧间隔 ≥100ms（对应 ≤10fps）；POPUP_MSG 等事件帧插入发送、不覆盖导航帧；实施阶段3 实测吞吐后校准。']),\n  ('6. 微信/短信通知到来', [\n    '6. 微信/短信通知到来：NotificationListenerService 捕获通知 → 组装 POPUP_MSG JSON 报文 → BLE 发送。',\n    '7. 导航结束 / 退出导航 / 退后台：发送 CLEAR_SCREEN 回到待机（避免导航态 3s 帧超时误报\"信号中断\"）；重新导航时从步骤 1 重走。']),\n])\nPYEOF", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -X utf8 - <<'PYEOF'\n# -*- coding: utf-8 -*-\np = '技术实现路径.md'\ns = open(p, encoding='utf-8', newline='').read().split('\\n')\nanchor = '7. **视觉验收冻结基准'\nidx = [i for i, l in enumerate(s) if anchor in l]\nassert len(idx) == 1, idx\nadd = '8. **参数化几何（V1.7 审查决策，H1-A）**：模板渲染由\"预置造型\"改为渲染端按 `type/dir/exits` 字段**参数化生成**；type×dir 合法组合与 `pts`/`exits` 语义见 ble_protocol.md §3.1.1，几何生成规则见 `docs/develp/模板几何规格.md`（草案，评审后并入 v2 参数化渲染与 C 版移植）。'\ns.insert(idx[0] + 1, add)\nopen(p, 'w', encoding='utf-8', newline='').write('\\n'.join(s))\nprint('OK 技术实现路径.md §1.5 新增第8条')\nPYEOF", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -X utf8 - <<'PYEOF'\n# -*- coding: utf-8 -*-\ndef load(p): return open(p, encoding='utf-8', newline='').read()\ndef save(p, s): open(p, 'w', encoding='utf-8', newline='').write(s)\n\np = '模板几何规格.md'\nlines = load(p).split('\\n')\n\ndef find(sub, after=0):\n    for i in range(after, len(lines)):\n        if sub in lines[i]: return i\n    raise SystemExit('NOT FOUND: ' + sub)\n\ndef rep_sec(start_sub, end_sub, new_block):\n    global lines\n    a = find(start_sub); b = find(end_sub, a + 1)\n    lines[a:b] = new_block\n\ndef rep_line(sub, new_line, cnt=1):\n    global lines\n    idxs = [i for i, l in enumerate(lines) if sub in l]\n    assert len(idxs) == cnt, (sub, len(idxs))\n    for i in idxs: lines[i] = new_line\n\n# 1) §2 表 exits 行：必填\nrep_line('| `exits` |', '| `exits` |（roundabout）出口方位数组，**不含入口**，按绕行方向排列（exits[0]=进入后第 1 岔路） | **必填**（roundabout 下） |')\n\n# 2) §3.2 整节重写\nrep_sec('### 3.2', '### 3.3', [\n'### 3.2 roundabout 的 `exitN` / `exits` 口径与弧向（O1 已裁决 2026-09-03，方案 1：数据驱动 + 方向弧）',\n'',\n'- `exits`：**不含南入口**的可驶出口方位数组，**按车辆实际绕行方向排列**（`exits[0]` = 进入环岛后第 1 个可驶出口）。手机端依据导航 SDK 路线确定绕行方向并排序后下发。',\n'- `dir=exitN`：N = **exits 下标 + 1**（纯渲染/几何口径，1 起，不含入口）——渲染端唯一的出口定位依据：目标方位 = `exits[N-1]`。',\n'- `maneuver=roundabout_N`：N = **导航 SDK 播报原文口径**（与语音一致），仅供顶部文字/符号；渲染端**不**据此定位出口。含数字的提示文本（\"环岛第 N 出口驶出\"）由手机端按 SDK 原文组装进 `hint`，避免双口径数字显示歧义。',\n'- SDK 适配（手机端，阶段4 实测）：记 SDK 出口计数是否含入口（高德/百度可能不同），换算 `dir_N = SDK_N − (SDK 含入口 ? 1 : 0)`；绕行方向由 SDK 路线确定（中国右行环岛通常逆时针：屏幕系角度增大方向，自南入先遇 W）。',\n'- 弧向：渲染端绿路径 = 自南入口**沿 exits 序列指示的绕行方向**画弧至目标出口（全弧，可能 >90°/180°），**禁用 v2/v3\"最近短弧\"**——短弧仅当目标恰为第 1 出口（相邻）时与方向弧重合。',\n'- ⚠️ v2 `rbtCase` / v3 样例当前为\"短弧 + 含入口编号 + 顺时针示例\"，与本节不符，属**待更新**（黄区代码任务，需重验收长弧观感）；样例数据按真实绕行语义重标。',\n])\n\n# 3) §5.3 整节重写（O2-A）\nrep_sec('### 5.3', '### 5.4', [\n'### 5.3 roundabout（帧参数驱动，O2 已裁决 2026-09-03，方案 A：观感参数 + 冻结比率表）',\n'',\n'- 观感参数与冻结比率表（比率以 `r`=外环水平半轴为基准；缺省即 v2 冻结观感，两端共享常量块）：',\n'',\n'| 量 | 定义 | 系数/取值 |\n| --- | --- | --- |\n| `cx` / `cy` | 观感椭圆中心（`road.cx/cy`） | 缺省 160 / 84 |\n| `r` | **观感外环水平半轴 a**（`road.r`） | 缺省 58 |\n| 外环垂直半轴 b | 0.40·r | 23 |\n| 内岛半轴 aIn / bIn | 0.66·r / 0.17·r | 38 / 10 |\n| 环带中线半轴 aM / bM | (a+aIn)/2、(b+bIn)/2 | 48 / 16.5 |\n| 环上支路半宽 rw | 0.31·r | 18 |\n| 南引路半宽 | 0.62·r | 36 |',\n'',\n'- 路面：`ellipse(cx,cy,r,b)` 灰路面 + `ellipse(cx,cy,aIn,bIn)` 内岛（暗）+ 环带描边。推荐发送端不自定义 `r`（如需缩放应整组等比；观感仅在缺省值下冻结）。',\n'- 支路：按 `exits` 各方位画静态支路（至屏幕边、半宽 rw）；目标出口支路**流动**。南引路 `(160,134) → (cx,cy+b)`、半宽 0.62·r、流动。',\n'- 方位角表（屏幕系，y 向下，θ 代入 `(a·cosθ, b·sinθ)`，顺时针为正）：E=0°、SE=45°、S=90°、SW=135°、W=180°、NW=225°、N=270°、NE=315°（=-45°）。与 v2（S=90°/E=0°/N=-90°）及 v3（NE=-45°）兼容。',\n'- 绿路径：`(160,134) → (cx,cy+b)` → 沿环带中线（aM/bM）由 θ=90°(S) **沿绕行方向**至目标出口方位角（椭圆参数角离散 16 段，与 C 一致）→ 驶出至屏幕边。绕行方向判据：`exits[0]` 方位角相对 S 的带符号角差（正=顺时针、负=逆时针），全程同向累计，**不做最近短弧**。',\n'- ⚠️ 方向弧使 N≥2 出口的绿路径可能 >180°，与 v2 现有象限短弧观感不同（黄区重验收项）。',\n])\n\n# 4) §5.4 表尾插入 roundabout 例外注释\nrep_line('| 匝道本身（fork 路面） | `side-6`（v2 冻结） | 29 |', '| 匝道本身（fork 路面） | `side-6`（v2 冻结） | 29 |\\n\\n> roundabout 例外：环带/环上支路/南引路半宽以 `r` 为基准（见 §5.3），不套用本表——v2 冻结中 TPL.main=62 与环岛南引路 36 并存属**有意差异**（决策 M2-A），规格层照实记录。')\n\n# 5) §5.5 删除（并入 §5.3）\nrep_sec('### 5.5', '## 6.', [])\n\n# 6) §8 O1/O2 结案\nrep_line('- **O1**', '- ~~O1~~ **已裁决（2026-09-03，方案 1）**：见 §3.2——exits 不含入口、按绕行序；dir=exitN=下标+1；maneuver 保 SDK 口径仅供文字；渲染端方向弧（弃短弧）；SDK 含入口适配集中在手机端（阶段4 实测高德/百度）。')\nrep_line('- **O2**', '- ~~O2~~ **已裁决（2026-09-03，方案 A）**：见 §5.3——`r` 重定义为观感外环水平半轴 a（缺省 58）+ 冻结比率表（b=0.40r、aIn=0.66r、bIn=0.17r、rw=0.31r、南引路=0.62r，cx/cy 缺省 160/84）。')\n\n# 7) 变更记录 V0.2\nrep_line('| 2026-09-03 | V0.1 |', [\n'| 2026-09-03 | V0.2 | O1 裁决（方案1：exits 不含入口/按绕行序、dir=exitN=下标+1、maneuver 保 SDK 口径、渲染端方向弧、SDK 适配在手机端）；O2 裁决（方案A：r=观感外环水平半轴 + 冻结比率表）；§2 exits 改必填；§5.5 并入 §5.3 |',\n'| 2026-09-03 | V0.1 |',\n])\nsave(p, '\\n'.join(lines))\nprint('OK 模板几何规格.md V0.2')\n\n# ============ 技术实现路径 §1.5 第7条 b≈34 → b≈23 ============\np2 = '技术实现路径.md'\nt = load(p2).split('\\n')\ni = [k for k, l in enumerate(t) if '7. **视觉验收冻结基准' in l]\nassert len(i) == 1, i\ni = i[0]\nt[i] = '7. **视觉验收冻结基准（2026-09-02，nav_sim_v2.html V2 迭代）**：模板近端路面基准半宽 main≈62px（主通行近宽≈124px，较初版 +1/3）；道路两侧流动虚线仅绘制在**导航路径所在道路**，其余支路为静态边线；环岛透视呈横椭圆（长轴水平 a≈58 / 垂直半轴 b≈23、内岛 aIn≈38/bIn≈10、环上支路 rw≈18、南引路半宽≈36，2026-09-03 对齐 V2 冻结代码）；黄车三角较路径起点上移约一个身位；弹窗显示规则见 2.1。'\nsave(p2, '\\n'.join(t))\nprint('OK 技术实现路径.md §1.5 第7条')\nPYEOF", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1 && python -X utf8 - <<'PYEOF'\ndef patch(p, ops):\n    lines = open(p, encoding='utf-8', newline='').read().replace('\\r\\n','\\n').split('\\n')\n    for sub, new_line, tag in ops:\n        idx = [i for i,l in enumerate(lines) if sub in l]\n        assert len(idx) == 1, (tag, idx)\n        lines[idx[0]] = new_line\n        print('OK', tag)\n    open(p,'w',encoding='utf-8',newline='').write('\\n'.join(lines))\n\npatch('docs/develp/实施方案.md', [\n ('| 2.8寸 SPI LCD（**集成板一体**）',\n  '| 2.8寸 SPI LCD（**集成板一体**） | 实物：**quandong-s3-dev（xiaozhi 生态 2.8″ 触摸板）**：ESP32-S3 + 2.8″ 240×320 SPI（**ILI9341**，引脚组合 A 实测点亮：SCLK=12/MOSI=11/MISO=13/CS=10/DC=46/BL=45）+ 电容触摸 **FT6336G**（不用）+ **ES8311 音频编解码/按键**（不用）；出厂预装 xiaozhi 固件 2.4.2（将替换）；原生竖屏→**横屏 320×240** 使用 |',\n  'T1 板型'),\n ('- LCD：**集成一体板**',\n  '- LCD：**quandong-s3-dev 集成板**（ESP32-S3 + 2.8″ ILI9341 240×320 SPI + FT6336G 触摸 + ES8311 音频），工作分辨率 **320×240 横屏**，RGB565、黑底；**需 INVON(反相型面板)**；触摸与音频不使用；出厂 xiaozhi 固件将被本项目固件覆盖（如需保留可先 read-flash 备份）。',\n  'T2 板级'),\n])\npatch('docs/develp/固件工程规划.md', [\n ('| 5 | 硬件核验',\n  '| 5 | 硬件核验（**已实测**）：①板型 **quandong-s3-dev（xiaozhi 生态 2.8″ 触摸板）**：ESP32-S3 rev v0.2、16MB flash、8MB **Octal** PSRAM（xiaozhi 日志证实可用）、USB-Serial/JTAG；②LCD=**ILI9341** + 引脚组合 A（SCLK12/MOSI11/MISO13/CS10/DC46/BL45，已点亮）+ 需 INVON；③触摸 FT6336G 与 ES8311 音频不使用；④**出厂 xiaozhi 固件需 erase-flash 覆盖**（建议先备份） | 与实施方案 2.4 一致 |',\n  'T3 核验'),\n ('3. ESP-IDF 基线 v6.1',\n  '3. ESP-IDF 基线 v6.1（E:/Espressif 安装器版 + \"IDF PowerShell Environment\"，旧克隆版弃用）；⚠️ 集成板出厂为 xiaozhi 固件（自带分区/OTA 记录），首次烧录本项目固件需先 `idf.py erase-flash`；PSRAM（Octal 8MB）启用时确认；',\n  'T4 环境'),\n])\npatch('docs/develp/工作清单与状态.md', [\n ('4. **硬件已到手并实测**',\n  '4. **硬件已到手并实测**：**quandong-s3-dev（xiaozhi 生态 2.8″ 触摸板）** = ESP32-S3 rev v0.2 + 16MB flash + 8MB Octal PSRAM + USB-Serial/JTAG；LCD=**ILI9341**（引脚组合 A，已点亮）/需 INVON；触摸 FT6336G、ES8311 音频不使用；**出厂预装 xiaozhi 固件 → 需 erase-flash 后烧本项目固件**',\n  'T5 状态'),\n])\nprint('ALL OK')\nPYEOF\ngit add docs/develp && git commit -m \"[绿区] docs: 硬件身份确认 — quandong-s3-dev(xiaozhi 生态 2.8\\\" 触摸板)：ILI9341(引脚组合A已点亮/需INVON)+FT6336G+ES8311+16MB flash+8MB Octal PSRAM；出厂 xiaozhi 固件需 erase-flash 覆盖(建议先备份)\" -q && git log --oneline -1", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/Esp32S3 && python -X utf8 - <<'PYEOF'\n# 1) json_lite.h 增加扁平点对解析\np='main/protocol/json_lite.h'; s=open(p,encoding='utf-8').read()\nold='/* 解析 \"key\": [[x,y],[x,y],...]；out_xy 交错存 x,y；返回点数 */\\nint  jl_get_pts16(const char *json, const char *key, int16_t *out_xy, int max);'\nnew=old+'\\n/* 解析 \"key\": [x,y]（单点）；成功返回 true */\\nbool jl_get_pair(const char *json, const char *key, int *x, int *y);'\nassert s.count(old)==1\nopen(p,'w',encoding='utf-8',newline='').write(s.replace(old,new)); print('OK json_lite.h')\n\n# 2) json_lite.c：修\"元素间逗号未跳过\" + 新增 jl_get_pair\np='main/protocol/json_lite.c'; s=open(p,encoding='utf-8').read()\nold='''    while (*p && n < max) {\n        p = skip_ws(p);\n        if (*p == ']') break;\n        if (*p != '[') break;'''\nnew='''    while (*p && n < max) {\n        p = skip_ws(p);\n        if (*p == ',') { p++; continue; }     /* 元素之间的分隔逗号 */\n        if (*p == ']') break;\n        if (*p != '[') break;'''\nassert s.count(old)==1\ns=s.replace(old,new)\ns = s.rstrip() + '''\n\nbool jl_get_pair(const char *json, const char *key, int *x, int *y)\n{\n    const char *p = find_value(json, key);\n    if (!p || *p != '[' || !x || !y) return false;\n    p++;\n    char *end = NULL;\n    const char *q = skip_ws(p);\n    double vx = strtod(q, &end);\n    if (end == q) return false;\n    p = skip_ws(end);\n    if (*p == ',') p++;\n    end = NULL;\n    q = skip_ws(p);\n    double vy = strtod(q, &end);\n    if (end == q) return false;\n    *x = (int)vx;\n    *y = (int)vy;\n    return true;\n}\n'''\nopen(p,'w',encoding='utf-8',newline='').write(s); print('OK json_lite.c 修复')\n\n# 3) nav_frame.c：pos 改用 jl_get_pair，日志加 pos\np='main/protocol/nav_frame.c'; s=open(p,encoding='utf-8').read()\nold='''    int16_t pos[2] = { 0, 0 };\n    if (jl_get_pts16(line, \"pos\", pos, 1) == 1) {\n        s_nav.pos.x = pos[0];\n        s_nav.pos.y = pos[1];\n        s_nav.pos_valid = true;\n    }'''\nnew='''    int px = 0, py = 0;\n    if (jl_get_pair(line, \"pos\", &px, &py)) {          /* pos 是扁平 [x,y] */\n        s_nav.pos.x = (int16_t)px;\n        s_nav.pos.y = (int16_t)py;\n        s_nav.pos_valid = true;\n    }'''\nassert s.count(old)==1\ns=s.replace(old,new)\nold2='''        ESP_LOGI(TAG, \"NAV_FRAME hint=%s dist=%d pts=%d road=%d\",\n                 s_nav.hint, s_nav.turn_dist, s_nav.center_n, (int)s_nav.has_road);'''\nnew2='''        ESP_LOGI(TAG, \"NAV_FRAME hint=%s dist=%d center=%d past=%d route=%d pos=%d,%d road=%d\",\n                 s_nav.hint, s_nav.turn_dist, s_nav.center_n, s_nav.past_n, s_nav.route_n,\n                 (int)s_nav.pos.x, (int)s_nav.pos.y, (int)s_nav.has_road);'''\nassert s.count(old2)==1\nopen(p,'w',encoding='utf-8',newline='').write(s.replace(old2,new2)); print('OK nav_frame.c')\nPYEOF\ncd /d/example/projects/Esp32Nav/v1.0.0.1 && git add Esp32S3/main && git commit -m \"[黄区] fix(fw): JSON 坐标解析修复 — ①jl_get_pts16 未跳过元素间逗号(centerLine 只解出 1 点导致路面不画) ②新增 jl_get_pair 解析扁平 pos[x,y] ③nav_frame 日志增强(center/past/route/pos)\" -q && git log --oneline -1", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/Esp32S3 && python -X utf8 - <<'PYEOF'\n# ---------- 1) lcd_fb：虚线相位偏移 ----------\np='main/render/lcd_fb.h'; s=open(p,encoding='utf-8').read()\nold='void fb_dashed_line(int x0, int y0, int x1, int y1, uint16_t color, int dash, int gap);'\nnew=old+'\\n/* 带相位偏移的虚线（offset 增大 -> 图案向起点(x0,y0)方向滚动） */\\nvoid fb_dashed_line_off(int x0, int y0, int x1, int y1, uint16_t color, int dash, int gap, float offset);'\nassert s.count(old)==1\nopen(p,'w',encoding='utf-8',newline='').write(s.replace(old,new)); print('OK lcd_fb.h')\n\np='main/render/lcd_fb.c'; s=open(p,encoding='utf-8').read()\nold='''void fb_dashed_line(int x0, int y0, int x1, int y1, uint16_t color, int dash, int gap)\n{\n    int dx = x1 - x0, dy = y1 - y0;\n    float len = sqrtf((float)(dx * dx + dy * dy));\n    if (len < 1.0f) return;\n    float ux = dx / len, uy = dy / len;\n    float pos = 0.0f;\n    while (pos < len) {\n        float e = pos + dash; if (e > len) e = len;\n        fb_line(x0 + (int)(ux * pos), y0 + (int)(uy * pos),\n                x0 + (int)(ux * e), y0 + (int)(uy * e), color);\n        pos += dash + gap;\n    }\n}'''\nnew='''void fb_dashed_line_off(int x0, int y0, int x1, int y1, uint16_t color, int dash, int gap, float offset)\n{\n    int dx = x1 - x0, dy = y1 - y0;\n    float len = sqrtf((float)(dx * dx + dy * dy));\n    if (len < 1.0f) return;\n    float ux = dx / len, uy = dy / len;\n    float cycle = (float)(dash + gap);\n    if (cycle < 1.0f) cycle = 1.0f;\n    float phase = fmodf(offset, cycle);\n    if (phase < 0) phase += cycle;\n    for (float pos = -phase; pos < len; pos += cycle) {\n        float a = pos < 0 ? 0.0f : pos;\n        float e = pos + dash;\n        if (e > len) e = len;\n        if (e <= a) continue;\n        fb_line(x0 + (int)(ux * a), y0 + (int)(uy * a),\n                x0 + (int)(ux * e), y0 + (int)(uy * e), color);\n    }\n}\n\nvoid fb_dashed_line(int x0, int y0, int x1, int y1, uint16_t color, int dash, int gap)\n{\n    fb_dashed_line_off(x0, y0, x1, y1, color, dash, gap, 0.0f);\n}'''\nassert s.count(old)==1\nopen(p,'w',encoding='utf-8',newline='').write(s.replace(old,new)); print('OK lcd_fb.c')\n\n# ---------- 2) render_nav：帧缓存 + 30fps tick（含虚线流动） ----------\np='main/render/render_nav.h'; s=open(p,encoding='utf-8').read()\nold='void render_nav_frame(const nav_frame_t *f);   /* 按协议帧渲染（直行条带；模板 M4） */'\nnew='''/* M3：帧到达时 set（仅缓存），显示任务周期调用 tick（含按 dash_speed 的虚线流动动画） */\nvoid render_nav_set_frame(const nav_frame_t *f);\nvoid render_nav_tick(float dt);\nvoid render_nav_frame(const nav_frame_t *f);   /* 立即渲染一帧（保留，便于调试） */'''\nassert s.count(old)==1\nopen(p,'w',encoding='utf-8',newline='').write(s.replace(old,new)); print('OK render_nav.h')\n\np='main/render/render_nav.c'; s=open(p,encoding='utf-8').read()\n# 渲染函数改为 tick 版：把 render_nav_frame 的函数体复制为静态 draw_frame(f, anim)，并加 set/tick\nold_head='''void render_nav_frame(const nav_frame_t *f)\n{\n    if (!f || !f->valid) return;'''\nnew_head='''static nav_frame_t s_cur;\nstatic bool s_have = false;\nstatic float s_anim = 0.0f;\n\nvoid render_nav_set_frame(const nav_frame_t *f)\n{\n    if (!f || !f->valid) return;\n    s_cur = *f;\n    s_have = true;\n}\n\nstatic void draw_frame(const nav_frame_t *f, float anim)\n{\n    if (!f || !f->valid) return;'''\nassert s.count(old_head)==1\ns = s.replace(old_head, new_head)\n\n# 边界虚线用带相位版本\nold_edge='''        /* 边界虚线（梯形左右边 + 顶点法线四角） */\n        fb_dashed_line(qx[0], qy[0], qx[3], qy[3], RGB565_WHITE, 8, 6);\n        fb_dashed_line(qx[1], qy[1], qx[2], qy[2], RGB565_WHITE, 8, 6);'''\nnew_edge='''        /* 边界虚线（带流动相位：offset 增大 -> 向近端/下方滚动） */\n        fb_dashed_line_off(qx[0], qy[0], qx[3], qy[3], RGB565_WHITE, 8, 6, anim);\n        fb_dashed_line_off(qx[1], qy[1], qx[2], qy[2], RGB565_WHITE, 8, 6, anim);'''\nassert s.count(old_edge)==1\ns = s.replace(old_edge, new_edge)\n\n# 中线虚线也用相位（车道虚线随速度流动）\nold_mid='''        for (int i = 0; i + 1 < f->center_n; i++) {\n            fb_dashed_line(f->center_line[i].x, f->center_line[i].y,\n                           f->center_line[i + 1].x, f->center_line[i + 1].y, RGB565_WHITE, 5, 7);\n        }'''\nnew_mid='''        for (int i = 0; i + 1 < f->center_n; i++) {\n            fb_dashed_line_off(f->center_line[i].x, f->center_line[i].y,\n                               f->center_line[i + 1].x, f->center_line[i + 1].y,\n                               RGB565_WHITE, 5, 7, anim);\n        }'''\nassert s.count(old_mid)==1\ns = s.replace(old_mid, new_mid)\n\n# 追加 tick / frame 包装\ns = s.rstrip() + '''\n\n/* 显示任务周期调用：推进虚线动画并重绘（dash_speed 来自 SET_CONFIG，默认 60 px/s） */\nvoid render_nav_tick(float dt)\n{\n    if (!s_have) return;\n    const espnav_config_t *cfg = config_get();\n    s_anim += (float)cfg->dash_speed * dt;\n    if (s_anim > 100000.0f) s_anim = 0.0f;\n    draw_frame(&s_cur, s_anim);\n}\n\n/* 立即渲染（调试/单帧） */\nvoid render_nav_frame(const nav_frame_t *f)\n{\n    render_nav_set_frame(f);\n    draw_frame(f, 0.0f);\n}\n'''\nif '#include \"config.h\"' not in s:\n    s = s.replace('#include \"esp_log.h\"', '#include \"esp_log.h\"\\n#include \"config.h\"')\nopen(p,'w',encoding='utf-8',newline='').write(s); print('OK render_nav.c（tick + 相位流动）')\n\n# ---------- 3) nav_frame：改为 set（不在解析线程里刷屏） ----------\np='main/protocol/nav_frame.c'; s=open(p,encoding='utf-8').read()\nold='        render_nav_frame(&s_nav);'\nnew='        render_nav_set_frame(&s_nav);   /* 由显示任务 tick 渲染（含动画） */'\nassert s.count(old)==1\nopen(p,'w',encoding='utf-8',newline='').write(s.replace(old,new)); print('OK nav_frame.c')\n\n# ---------- 4) display_task：真正的周期渲染 ----------\np='main/display_task.c'; s=open(p,encoding='utf-8').read()\nold='''static void display_task(void *arg)\n{\n    (void)arg;\n    ESP_LOGI(TAG, \"display task running (30fps 渲染待 M1/M3 接入)\");\n    for (;;) {\n        /* TODO(M1): 按 dash_speed 推进虚线 offset 并重绘变化区域/整帧 */\n        vTaskDelay(pdMS_TO_TICKS(1000));\n    }\n}'''\nnew='''static void display_task(void *arg)\n{\n    (void)arg;\n    ESP_LOGI(TAG, \"display task running (周期渲染 + 虚线流动动画)\");\n    int64_t last = esp_timer_get_time();\n    for (;;) {\n        vTaskDelay(pdMS_TO_TICKS(33));                  /* 目标 30fps（实际受 SPI 传输限制） */\n        int64_t now = esp_timer_get_time();\n        float dt = (float)(now - last) / 1000000.0f;\n        last = now;\n        if (dt > 0.5f) dt = 0.5f;\n        render_nav_tick(dt);\n    }\n}'''\nassert s.count(old)==1\ns = s.replace(old,new)\ns = s.replace('#include \"esp_log.h\"','#include \"esp_log.h\"\\n#include \"esp_timer.h\"\\n#include \"render/render_nav.h\"')\nopen(p,'w',encoding='utf-8',newline='').write(s); print('OK display_task.c')\nPYEOF\necho \"== 复核引号换行 ==\" && python -X utf8 -c \"\nimport glob,re\nbad=[f for f in glob.glob('main/**/*.[ch]',recursive=True) if re.search(r\\\"'(\\r?\\n)\\\", open(f,encoding='utf-8').read())]\nprint('bad:', bad or 'none')\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1 && python -X utf8 - <<'PYEOF'\njs = r'''/**\n * send_frames.js — PC 端测试脚本：向 ESP32 TCP :8899 发送协议帧（V1.10）\n * 用法：\n *   node send_frames.js --host 192.168.4.1 --port 8899 --demo\n *   node send_frames.js --file frames.jsonl     # 每行一个完整 JSON 帧\n * 真机语义（M3 起固件按此实现）：\n *   - 车标 pos 固定（车头朝上视角，车在画面底部）；\n *   - centerLine/pastCenter/routeCenter 随行驶更新；\n *   - 两侧虚线“向下滚动”由渲染端按 dash_speed 做动画，不靠帧位移。\n */\n'use strict';\nconst net = require('net');\nconst fs = require('fs');\n\nfunction arg(name, def) {\n  const i = process.argv.indexOf('--' + name);\n  return i > 0 ? process.argv[i + 1] : def;\n}\nconst HOST = arg('host', '192.168.4.1');\nconst PORT = parseInt(arg('port', '8899'), 10);\nconst FILE = arg('file', null);\n\nfunction frameObj(payload, type = 'NAV_FRAME') {\n  return JSON.stringify({ msg_type: type, payload: payload }) + '\\n';\n}\n/* 固定中心线；pastCount 增长模拟“已行驶段变长”，pos 固定不动 */\nfunction stripFrame(turnDist, hint, pastCount) {\n  const center = [[160, 130], [160, 110], [160, 80], [160, 50], [160, 28]];\n  const pc = Math.max(1, Math.min(center.length - 1, pastCount));\n  return {\n    heading: 0, turn_dist: turnDist, hint: hint,\n    total_dist: 8200, progress_pct: 34, elapsed_min: 28, eta_time: '14:27',\n    centerLine: center,\n    pastCenter: center.slice(0, pc + 1),\n    routeCenter: center.slice(pc),\n    pos: [160, 122]                      /* 车标固定（真机语义） */\n  };\n}\n\nconst sock = net.connect(PORT, HOST, () => {\n  console.log('[ok] connected ' + HOST + ':' + PORT);\n  if (FILE) {\n    const lines = fs.readFileSync(FILE, 'utf8').split(/\\r?\\n/).filter(Boolean);\n    let i = 0;\n    const t = setInterval(() => {\n      if (i >= lines.length) { clearInterval(t); sock.end(); return; }\n      sock.write(lines[i].trim() + '\\n');\n      console.log('[tx] ' + lines[i].slice(0, 100));\n      i++;\n    }, 300);\n  } else {\n    let n = 0;\n    const t = setInterval(() => {\n      n++;\n      if (n <= 10) {\n        const turnDist = 500 - n * 40;\n        sock.write(frameObj(stripFrame(turnDist, '前方' + turnDist + '米直行', 1 + Math.floor(n / 4))));\n        console.log('[tx] frame#' + n + ' turn_dist=' + turnDist + ' past=' + (1 + Math.floor(n / 4)));\n      } else if (n === 11) {\n        sock.write(frameObj({ ts: Math.floor(Date.now() / 1000) }, 'PING'));\n        console.log('[tx] PING');\n      } else if (n === 12) {\n        sock.write(frameObj({}, 'GET_CONFIG'));\n        console.log('[tx] GET_CONFIG');\n      } else {\n        clearInterval(t); sock.end();\n      }\n    }, 400);\n  }\n});\nsock.on('data', d => console.log('[rx] ' + d.toString().trim()));\nsock.on('error', e => console.log('[err] ' + e.message + '（确认电脑已连上 ESPNav-AP 热点）'));\nsock.on('close', () => console.log('[close]'));\n'''\nopen('mobileApp/tools/send_frames.js','w',encoding='utf-8',newline='').write(js)\nprint('written send_frames.js (真实语义: pos 固定 / past 增长)')\nPYEOF\nnode --check mobileApp/tools/send_frames.js && echo \"SYNTAX OK\" && git add Esp32S3/main mobileApp/tools/send_frames.js && git commit -m \"[黄区+绿区] feat(fw): M3 虚线流动动画 — ①fb_dashed_line_off 相位偏移 ②render_nav set_frame/tick(显示任务周期重绘, dash_speed 推进 offset) ③nav_frame 改为缓存帧不阻塞接收 ④display_task 真正 33ms 渲染循环 ⑤send_frames 改为真机语义(pos 固定/past 增长)\" -q && git log --oneline -1", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/Esp32S3 && python -X utf8 - <<'PYEOF'\np='main/CMakeLists.txt'; s=open(p,encoding='utf-8').read()\nold='  REQUIRES esp_driver_spi esp_driver_gpio esp_driver_ledc esp_psram esp_wifi esp_netif nvs_flash lwip'\nnew='  REQUIRES esp_driver_spi esp_driver_gpio esp_driver_ledc esp_psram esp_wifi esp_netif nvs_flash lwip esp_timer'\nassert s.count(old)==1\nopen(p,'w',encoding='utf-8',newline='').write(s.replace(old,new))\nprint('OK CMake +esp_timer')\nPYEOF\ncd /d/example/projects/Esp32Nav/v1.0.0.1 && git add Esp32S3/main/CMakeLists.txt && git commit -m \"[黄区] fix(fw): 补 esp_timer 组件依赖（display_task 用 esp_timer_get_time，IDF 提示依赖缺失）\" -q && git log --oneline -1", "Bash=python -c \"import PIL; print('PIL', PIL.__version__)\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/Esp32S3 && mkdir -p tools main/font && python -X utf8 - <<'PYEOF'\nscript = r'''# -*- coding: utf-8 -*-\n\"\"\"gen_font.py — 生成 ESP32 点阵字库（ASCII 8x16 + 常用汉字 16x16）\n依赖：Python + Pillow（已装 10.2），Windows 系统字体。\n输出：main/font/font_data.c（Unicode 索引子集字库；缺字显示占位方块）\n运行：python tools/gen_font.py\n\"\"\"\nimport os\nfrom PIL import Image, ImageDraw, ImageFont\n\n# ---------- 字集 ----------\nHANZI = (\n \"前方米直行左右转路口弯道岛第出驶多岔走侧支靠匝道十字继续掉头进入离开距\"\n \"离到达预计全程已完成耗时信号中断微短信张三来电未接方向北南东西环主辅并\"\n \"线段起点终剩余分钟小时公设置亮度动画速度弹窗消息关闭清除暂无数据连接成\"\n \"功失败重试等待初始化错误状态电量充电导航开始结束取消确认返回菜单首页图\"\n \"路线规划偏航重算拥堵缓行事故施工限速拍照测速服务区收费站桥梁隧道高速国\"\n \"道省县乡上下一二三四五六七八九十百千万零地点老记得准时过来个取件码稍后\"\n \"发材料明天早晚上\"\n)\nSYMBOLS = \"…｜：°\"\n\ndef render_glyph(ch, w, h, fontpath, size, yoff=0):\n    \"\"\"渲染单字到位图并居中裁剪到 w×h，返回按行(MSB 左)的字节列表\"\"\"\n    S = 48\n    img = Image.new('L', (S, S), 0)\n    d = ImageDraw.Draw(img)\n    try:\n        font = ImageFont.truetype(fontpath, size)\n    except Exception:\n        font = ImageFont.load_default()\n    d.text((S // 2, S // 2 + yoff), ch, font=font, fill=255, anchor='mm')\n    bbox = img.getbbox()\n    if bbox:\n        img = img.crop(bbox)\n    # 居中贴入 w×h\n    out = Image.new('L', (w, h), 0)\n    ox = max(0, (w - img.width) // 2)\n    oy = max(0, (h - img.height) // 2)\n    out.paste(img.crop((0, 0, min(img.width, w), min(img.height, h))), (ox, oy))\n    px = out.load()\n    rows = []\n    for y in range(h):\n        bits = 0\n        for x in range(w):\n            if px[x, y] >= 96:\n                bits |= (1 << (w - 1 - x))\n        rows.append(bits)\n    return rows\n\ndef pack(rows, w):\n    nb = (w + 7) // 8\n    data = bytearray()\n    for y in range(len(rows)):\n        v = rows[y]\n        for b in range(nb):\n            data.append((v >> (8 * (nb - 1 - b))) & 0xFF)\n    return data\n\nFONT_ZH = r'C:\\Windows\\Fonts\\simhei.ttf'      # 黑体（16px 清晰）\nFONT_ASCII = r'C:\\Windows\\Fonts\\consola.ttf'  # Consolas（半角）\n\nglyphs = []   # (cp, w, data)\n# ASCII 8x16\nfor cp in range(0x20, 0x7F):\n    rows = render_glyph(chr(cp), 8, 16, FONT_ASCII, 13)\n    glyphs.append((cp, 8, pack(rows, 8)))\n# 符号 + 汉字 16x16\nseen = set()\nfor ch in SYMBOLS + HANZI:\n    cp = ord(ch)\n    if cp in seen:\n        continue\n    seen.add(cp)\n    rows = render_glyph(ch, 16, 16, FONT_ZH, 16)\n    glyphs.append((cp, 16, pack(rows, 16)))\n\nglyphs.sort(key=lambda g: g[0])\n\nbits = bytearray()\ntable = []\nfor cp, w, data in glyphs:\n    table.append((cp, w, len(bits)))\n    bits.extend(data)\n\n# ---------- 抽样预览（终端） ----------\ndef preview(chlist):\n    by = {g[0]: (g[1], g[2]) for g in glyphs}\n    for ch in chlist:\n        cp = ord(ch)\n        if cp not in by:\n            print('missing:', ch); continue\n        w, off = by[cp]\n        nb = (w + 7) // 8\n        print('--- %s (U+%04X, %dpx) ---' % (ch, cp, w))\n        for y in range(16):\n            line = ''\n            for b in range(nb):\n                line += format(bits[off + y * nb + b], '08b')\n            print(line[:w].replace('0', '.').replace('1', '#'))\n\npreview(['前', '方', '米', '转', '4', 'm', '：', '…'])\n\n# ---------- 输出 C ----------\nout = []\nout.append('/* 自动生成：tools/gen_font.py（请勿手改）')\nout.append(' * 点阵字库子集：ASCII 8x16 + %d 个汉字/符号 16x16（Unicode 索引，二分查找）' % (len(glyphs) - 95))\nout.append(' */')\nout.append('#include \"font.h\"')\nout.append('')\nout.append('const font_glyph_t font_glyphs[] = {')\nfor cp, w, off in table:\n    out.append('    { 0x%04X, %d, %d },' % (cp, w, off))\nout.append('};')\nout.append('const int font_glyph_count = %d;' % len(table))\nout.append('')\nout.append('const uint8_t font_bits[] = {')\nline = '    '\nfor i, b in enumerate(bits):\n    line += '0x%02X,' % b\n    if (i + 1) % 16 == 0:\n        out.append(line)\n        line = '    '\nif line.strip():\n    out.append(line)\nout.append('};')\nout.append('')\n\nopen(os.path.join('main', 'font', 'font_data.c'), 'w', encoding='utf-8', newline='').write('\\n'.join(out))\nprint('glyphs=%d bits=%d bytes -> main/font/font_data.c' % (len(table), len(bits)))\n'''\nopen('tools/gen_font.py','w',encoding='utf-8',newline='').write(script)\nprint('written tools/gen_font.py')\nPYEOF\npython tools/gen_font.py", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1 && cp mobileApp/android/app/build/outputs/apk/debug/app-debug.apk mobileApp/android/espnav-debug.apk && ls -la mobileApp/android/espnav-debug.apk | awk '{printf \"APK: %.1f MB (刚更新)\\n\", $5/1048576}' && git add mobileApp/android && git commit -q -m \"[绿区] feat(app): 高德导航前外网自检 — 连 ESPNav-AP(无外网)时高德 SDK 无法算路/校验 Key；现在点「高德导航」会先检测外网, 无外网则明确提示并给出配网步骤(手机开热点->配网->切回热点->连 ESP32 内网 IP)。本地编译 BUILD SUCCESSFUL(25s)，APK 已更新\" && git log --oneline -1", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/Esp32S3 && python -X utf8 - <<'PYEOF'\np='main/render/render_nav.c'; s=open(p,encoding='utf-8').read()\n\n# 1) include wifi_sta（网络状态）\nif 'wifi_sta.h' not in s:\n    s = s.replace('#include \"config.h\"', '#include \"config.h\"\\n#include \"wifi_sta.h\"      /* 屏幕显示网络状态（AP / STA 已连接） */')\n\n# 2) 新增 draw_net_status()，放在 draw_compass 之前\nif 'draw_net_status' not in s:\n    anchor = 'static void draw_compass(const nav_frame_t *f)'\n    add = '''/* 顶部网络状态行：STA 已连接 <ip> / STA 未连接 AP:ESPNav-AP\n * 用途：不用看串口也能确认 ESP32 当前是\"只开热点\"还是\"已连上手机热点\"。 */\nstatic void draw_net_status(void)\n{\n    static char buf[48];\n    if (wifi_sta_is_connected()) {\n        const char *ip = wifi_sta_ip_str();\n        snprintf(buf, sizeof(buf), \"STA 已连接 %s\", (ip && ip[0]) ? ip : \"?\");\n    } else {\n        snprintf(buf, sizeof(buf), \"STA 未连接 AP:ESPNav-AP\");\n    }\n    font_draw_text(4, 2, buf, 0x7BEF);         /* 浅灰：不抢导航信息 */\n}\n\n'''\n    s = s.replace(anchor, add + anchor, 1)\n\n# 3) 罗盘：中文方位（4 主方位，避免 16px 汉字重叠）\ns = s.replace('    static const char *labels[8] = { \"N\", \"NE\", \"E\", \"SE\", \"S\", \"SW\", \"W\", \"NW\" };',\n              '    static const char *labels[4] = { \"北\", \"东\", \"南\", \"西\" };   /* 中文方位（字库已含） */')\ns = s.replace('''    for (int i = 0; i < 8; i++) {\n        int off = (((((i * 45) - f->heading + 360) % 360) - 180) * spread) / 180;''',\n'''    for (int i = 0; i < 4; i++) {\n        int off = (((((i * 90) - f->heading + 360) % 360) - 180) * spread) / 180;''')\n\n# 4) 文字层：hint / 距离 各下移一行，并调用网络状态行\ns = s.replace('''        font_clip_utf8(f->hint, 9 * 16, buf, sizeof(buf));      /* hint ≤9 全角（协议 §6.7） */\n        font_draw_text(4, 2, buf, PATH_GREEN);\n\n        snprintf(buf, sizeof(buf), \"距离：%d m\", (int)f->turn_dist);\n        font_draw_text(4, 22, buf, PATH_GREEN);''',\n'''        font_clip_utf8(f->hint, 9 * 16, buf, sizeof(buf));      /* hint ≤9 全角（协议 §6.7） */\n        font_draw_text(4, 22, buf, PATH_GREEN);                 /* 下移一行：让顶部留给网络状态 */\n\n        snprintf(buf, sizeof(buf), \"距离：%d m\", (int)f->turn_dist);\n        font_draw_text(4, 42, buf, PATH_GREEN);                 /* 下移一行 */''')\n\n# 5) draw_frame 里调用网络状态（罗盘之前）\ns = s.replace('''    /* 罗盘 + 行程图（不依赖 RENDER_TEXT 开关） */\n    draw_compass(f);''',\n'''    /* 顶部网络状态 + 罗盘 + 行程图（不依赖 RENDER_TEXT 开关） */\n    draw_net_status();\n    draw_compass(f);''')\n\nopen(p,'w',encoding='utf-8',newline='').write(s)\nfor k, v in {\n    'include wifi_sta.h': '#include \"wifi_sta.h\"' in s,\n    'draw_net_status 实现': 'static void draw_net_status(void)' in s,\n    'draw_net_status 调用': 'draw_net_status();' in s,\n    '罗盘中文': '\"北\", \"东\", \"南\", \"西\"' in s,\n    'hint 下移(y=22)': 'font_draw_text(4, 22, buf, PATH_GREEN);                 /* 下移一行' in s,\n    '距离 下移(y=42)': 'font_draw_text(4, 42, buf, PATH_GREEN);' in s,\n}.items():\n    print(('  OK  ' if v else '  ❌ ') + k)\nPYEOF\npython -X utf8 tools/precheck.py main", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/Esp32S3 && echo \"=== draw_frame 里所有横线/分区线相关 ===\" && grep -n \"fb_line\\|fb_dashed_line\\|fb_fill_rect\" main/render/render_nav.c | head -20 && echo \"=== draw_frame 开头的清屏与顶部绘制（前 25 行）===\" && sed -n '/^static void draw_frame/,/^    if (f->road.present)/p' main/render/render_nav.c | head -30", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/Esp32S3 && echo \"=== font.h 对外接口 ===\" && cat main/font/font.h && echo \"=== font.c 里 font_draw_text 实现 ===\" && sed -n '/void font_draw_text/,/^}/p' main/font/font.c", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/Esp32S3 && sed -n '/^int font_draw_text/,/^}/p' main/font/font.c && echo \"=== 辅助函数（find_glyph / 解码）===\" && grep -n \"^static\\|^int\\|^void\" main/font/font.c"]

