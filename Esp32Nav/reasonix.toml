oad 可选字段，技术路径 1.5 模板与透视规格，方案/计划同步\" && git log --oneline -4 && git status --short", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"import re; s=open('nav_sim_v2.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && echo \"SYNTAX OK\" && rm _t.js && python -c \"\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nprint('PROJ锚点:', re.search(r'const PROJ = \\{([^}]*)\\}',s).group(1))\nprint('flow edge调用(edgeLines内drawFlowingDashLine):', s.count('drawFlowingDashLine(L1[0]'))\nprint('模板分支推进animOffset:', 'animOffset = (animOffset + CONFIG.roadEdgeSpeed*dt)' in s)\nprint('roadStraight参数化:', 'function roadStraight(c, halfW)' in s)\nprint('TPL常量:', 'const TPL' in s)\nprint('北出口零段残留(应False):', '[160,22],[160,22]' in s)\nprint('straight含navPath:', s.count(\\\"straight(){ const c=[[160,134],[160,22]]; roadStraight(c, TPL.main); navPath(c); }\\\")==1)\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"\nimport re\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nprint('PROJ锚点:', re.search(r'const PROJ = \\{([^}]*)\\}',s).group(1))\nprint('flow edge:', s.count('drawFlowingDashLine(L1[0]')==1 and s.count('drawFlowingDashLine(R1[0]')==1)\nprint('推进animOffset:', 'animOffset = (animOffset + CONFIG.roadEdgeSpeed*dt)' in s)\nprint('roadStraight参数化:', 'function roadStraight(c, halfW)' in s)\nprint('TPL:', 'const TPL' in s, '| 北出口零段残留:', '[160,22],[160,22]' in s)\nprint('straight含navPath:', s.count('roadStraight(c, TPL.main); navPath(c)')==1)\nprint('rbt南引路32:', 'branch([[160,134],[160,118]],32)' in s)\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"import re; s=open('nav_sim_v2.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && echo \"SYNTAX OK\" && rm _t.js && python -c \"\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nfor k in ['TP_CAR = [160,113]','wrapPopupLines','paintPopupText()','dimScreen','openPopup','closePopup','clearPopupTimers','POPUP_LINE_MS','popupMsg.top']:\n    print(k,'->',s.count(k))\nprint('paintPopupText内tctx(应0):', s[s.find('function paintPopupText'):s.find('function paintLostText')].count('tctx'))\nprint('renderFrame弹窗末置:', s.count('dimScreen();') )\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"import re; s=open('nav_sim_v2.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && echo \"SYNTAX OK\" && rm _t.js && python -c \"\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nprint('TPL:', re.search(r'const TPL = \\{([^}]*)\\}',s).group(1))\nprint('branchStatic调用:', s.count('branchStatic('))\nprint('staticEdges定义:', 'function staticEdges' in s)\nprint('首屏+3s:', 'POPUP_LINE_MS + 3000' in s)\nprint('环岛新尺寸(cy74/rOut52):', 'cy=74, rOut=52' in s, '| 南引路40:', 'branch([[160,134],[160,126]],40)' in s)\nprint('multi ellipse21:', '21*scaleAt(cy)' in s)\nprint('TP_CAR:', 'TP_CAR = [160,113]' in s)\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"import re; s=open('nav_sim_v2.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && echo \"SYNTAX OK\" && rm _t.js && python -c \"\nimport re\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nprint('TPL:', re.findall(r'const TPL = \\{([^}]*)\\}',s))\nprint('branchStatic调用数:', s.count('branchStatic('))\nprint('staticEdges定义:', 'function staticEdges' in s)\nprint('首屏+3s:', 'POPUP_LINE_MS + 3000' in s)\nprint('rbt cy74 rOut52:', 'cy=74, rOut=52' in s)\nprint('multi ellipse21:', '21*scaleAt(cy)' in s)\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1 && python docs/develp/_tmp_patch6.py && rm docs/develp/_tmp_patch6.py && echo \"script removed\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1 && python - <<'PYEOF'\n# -*- coding: utf-8 -*-\nimport io\n\ndef load(p):\n    return open(p, encoding='utf-8').read()\n\ndef save(p, s):\n    open(p, 'w', encoding='utf-8', newline='').write(s)\n\ndef rep1(s, old, new, tag):\n    if s.count(old) != 1:\n        raise SystemExit('ANCHOR FAIL(%d): %s' % (s.count(old), tag))\n    return s.replace(old, new)\n\np1 = 'docs/develp/技术实现路径.md'\ns = load(p1)\ns = rep1(s, '（V1.5）', '（V1.6）', 'T1 版本引用')\ns = rep1(s,\n    '6. **约束更新**：放弃真实路口矢量还原不变；路口段由\"统一条带\"改为\"模板化近似几何放大图\"，直行段仍为宽条带。',\n    '6. **约束更新**：放弃真实路口矢量还原不变；路口段由\"统一条带\"改为\"模板化近似几何放大图\"，直行段仍为宽条带。\\n'\n    '7. **视觉验收冻结基准（2026-09-02，nav_sim_v2.html V2 迭代）**：模板近端路面基准半宽 main≈62px（主通行近宽≈124px，较初版 +1/3）；道路两侧流动虚线仅绘制在**导航路径所在道路**，其余支路为静态边线；环岛 rOut≈52；黄车三角较路径起点上移约一个身位；弹窗显示规则见 2.1。',\n    'T2 1.5 第7条')\ns = rep1(s,\n    '- 缓冲策略：LCD 控制器自带 GRAM',\n    '- 弹窗显示规则（V1.6）：内容可视 3 行×17 全角；超长内容首屏多停 3s（约 4.4s）后每 1.4s 逐行上滚、末屏停留 2.4s 自动关闭；弹窗期间非弹窗区域置灰、弹窗文字绿色，关闭恢复。\\n'\n    '- 缓冲策略：LCD 控制器自带 GRAM',\n    'T3 2.1 弹窗规则')\nsave(p1, s)\nprint('OK 技术实现路径.md')\n\np2 = 'docs/develp/实施计划.md'\ns = load(p2)\ns = rep1(s, '（已完成 V1.5）', '（已完成 V1.6）', 'P1 版本引用')\nsave(p2, s)\nprint('OK 实施计划.md')\nPYEOF\nrm docs/develp/_tmp_patch6.py 2>/dev/null; echo \"tmp cleaned\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1 && git add -A && git commit -m \"feat(html+v1.6): v2 视觉验收迭代 — 弹窗首屏+3s/滚动/置灰绿字、模板近宽+1/3、流动虚线仅导航道路；协议 V1.6 行为澄清 + 文档同步\" && git log --oneline -3 && git status --short && cd docs/develp && for f in nav_sim_v2.html nav_sim_v3.html; do python -c \"import re,sys; s=open('$f',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && rm _t.js && echo \"$f OK\"; done", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"import re; s=open('nav_sim_v2.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && echo \"SYNTAX OK\" && rm _t.js && python -c \"\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nprint('roundedRing新签名:', 'function roundedRing(cx,cy,a,b,t)' in s)\nprint('ellArcPts定义/调用:', 'function ellArcPts' in s, s.count('ellArcPts('))\nprint('旧rOut残留(应False):', 'rOut' in s[s.find('function rbtCase'):s.find('function setRoad')])\nprint('横椭圆a>b:', 'a=58, b=34' in s)\nprint('角语义注释:', '南=90°' in s)\nprint('弧线走ellArcPts:', 'ellArcPts(cx,cy,aM,bM' in s)\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1 && python - <<'PYEOF'\n# -*- coding: utf-8 -*-\np='docs/develp/技术实现路径.md'\ns=open(p,encoding='utf-8').read()\nold='环岛 rOut≈52'\nnew='环岛透视呈横椭圆（长轴水平 a≈58 / 垂直半轴 b≈34）'\nassert s.count(old)==1\ns=s.replace(old,new)\nopen(p,'w',encoding='utf-8',newline='').write(s)\nprint('OK 技术实现路径.md')\nPYEOF", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1 && git add -A && git commit -m \"fix(html): 环岛透视修正 — 环形改为横椭圆(长轴水平 a58/b34)，行驶弧沿椭圆环带中线(ellArcPts)；同步技术路径 1.5\" && git log --oneline -2 && git status --short", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"import re; s=open('nav_sim_v2.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && echo \"SYNTAX OK\" && rm _t.js && python -c \"\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nprint('纵轴b=23(缩小1/3):', 'a=58, b=23' in s and 'aIn=38, bIn=10' in s)\nprint('roundedRing四轴:', 'function roundedRing(cx,cy,a,b,aIn,bIn)' in s)\nprint('badges状态:', 'let badges = {wx:2, sms:1, call:3}' in s)\nprint('paintBadges定义/调用:', s.count('function paintBadges')==1, s.count('paintBadges()')>=2)\nprint('badgeCount/drawIconTile/simBadge:', all(x in s for x in ['badgeCount','drawIconTile','simBadge']))\nprint('角标函数在文字层调用:', 'paintBadges();' in s)\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"import re; s=open('nav_sim_v2.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && echo \"SYNTAX OK\" && rm _t.js && python -c \"\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nprint('锚顶等比放大已插入:', 'ctx.translate(160, 22); ctx.scale(_k, _k)' in s)\nprint('_k 公式:', 'CONFIG.areaMain.h - 4 - 22' in s)\nk=(160-4-22)/(132-22)\nprint('当前 h=160 → k=%.4f (近端y132→%.1f, 底宽x1.218)'%(k, 22+(132-22)*k))\nprint('badges 贴底 by:', 'CONFIG.areaMain.h - 22' in s, '→ y=', 160-22)\nprint('restore配对: 主视图区 restore 计数仍为1(应在transform后):', s[s.find('ctx.translate(160, 22)'):s.find('function drawPopupBg')].count('ctx.restore()')==1)\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"import re; s=open('nav_sim_v2.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && echo \"SYNTAX OK\" && rm _t.js && python -c \"\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nprint('k=1.1 生长11px:', '(132 + 11 - 22)' in s)\nprint('badge y123:', 'const by = 123;' in s)\nk=1.1\nprint('近端y: %.0f, 底边(160)间隙: %.0fpx, 底宽x1.1'%(22+(132-22)*k, 160-(22+(132-22)*k)))\n\"", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1 && python - <<'PYEOF'\n# -*- coding: utf-8 -*-\np='docs/develp/技术实现路径.md'\ns=open(p,encoding='utf-8').read()\n\nsec = (\n    '### 1.6 转向过程与防误判策略\\n'\n    '> 目标：路口转向/变道时画面变化可信、不易误判（渲染验收口径；HTML \"通过路口\"演示待补）。\\n'\n    '\\n'\n    '**阶段帧序列（手机端驱动）**\\n'\n    '1. 直行接近（>200m）：帧无 `road` 字段 → 行驶条带；仅顶部机动文字/符号预告。\\n'\n    '2. 放大图进入（`turn_dist` < 200m 且非直行）：附加 `road`；模板南引路与行驶条带同轴同宽（当前路延续）；非导航支路静态、当前路两侧流动高亮（V1.6 已冻结）。\\n'\n    '3. 转向执行：车标沿绿路径（模板内真实走向：十字直角 / 环岛椭圆弧）由入口推进至出口。\\n'\n    '4. 驶离恢复：去掉 `road`；新行驶条带按转向后 heading 生成，其中轴 = 模板出口方向、车在底部同位。\\n'\n    '\\n'\n    '**防误判规则（推荐默认，两端一致）**\\n'\n    '1. 切换时序：远距仅文字预告；中距（≤200m）模板 150-250ms 淡入（防闪变）；驶出后 ≥100m 稳定窗口，不触发下一模板（防连续路口跳变）。\\n'\n    '2. 几何连续：入/出口衔接禁止中心线角度突变；切回条带中轴 = 出口方向；车位置连续。\\n'\n    '3. 单一语义：顶部机动文字/符号、绿路径拐向、模板出口三者恒同向，不一致时退回条带；绿路径始终最亮、最上层。\\n'\n    '4. heading 处理：手机端限速旋转 + 低通；模板几何不随 heading 转动，仅车标/罗盘联动（省带宽、防运动眩晕）。\\n'\n    '5. 滞回与异常：进入 200m / 退出 60m 滞回防抖；导航重算/偏航立即丢弃模板回条带、按新路线重走流程；弹窗/信号中断不遮挡绿路径与出口区。\\n'\n    '6. 极端机动：掉头/U-turn 用专用 U 形弧路径 + 转向符号（不套十字模板）；斜交/连续岔路优先分叉引导（fork/multi）。\\n'\n    '\\n'\n)\nanchor = '## 2. ESP32\\u2011S3固件实现'\nassert s.count(anchor) == 1\ns = s.replace(anchor, sec + anchor, 1)\nopen(p,'w',encoding='utf-8',newline='').write(s)\nprint('OK 技术实现路径.md §1.6')\nPYEOF", "Bash=cd /d/example/projects/Esp32Nav/v1.0.0.1/docs/develp && python -c \"import re; s=open('nav_sim_v2.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>', s, re.S); open('_t.js','w',encoding='utf-8',newline='').write(m.group(1))\" && node --check _t.js && echo \"SYNTAX OK\" && rm _t.js && python -c \"\ns=open('nav_sim_v2.html',encoding='utf-8').read()\nfor k in ['function turnDemo','function finishTurn','function pointOnPath','function clearDemoTimers','let demoFade = -1','let demoCar = null','let demoHandle = null','turnDemo()','demoCar = {pts:pathPts']:\n    print(k,'->',s.count(k))\nprint('drawScene引用demoFade/demoCar:', 'demoFade>=0' in s and 'pointOnPath(demoCar.pts' in s)\nprint('清理钩子: loadSample/setRoad/clearScreen含clearDemoTimers:',\n      s[s.find('function loadSample'):s.find('function loadSample')+90].count('clearDemoTimers')>0,\n      s[s.find('function setRoad'):s.find('function setRoad')+60].count('clearDemoTimers')>0,\n      s[s.find('function clearScreen'):s.find('function clearScreen')+60].count('clearDemoTimers')>0)\n\""]

